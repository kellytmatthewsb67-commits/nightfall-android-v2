name: Nightfall Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      GODOT_VERSION: "4.4.1"
      GODOT_CHANNEL: "stable"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract uploaded game ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -name 'Nightfall_Godot_M0M1_ArtUpgrade_*.zip' -print -quit)"
          test -n "$ZIP"
          mkdir -p /tmp/nightfall-source
          unzip -q "$ZIP" -d /tmp/nightfall-source
          cp -a /tmp/nightfall-source/NightfallGodot/. .
          test -f project.godot
          test -f export_presets.cfg

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android export dependencies
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          curl -fL --retry 3 -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" godot
          chmod +x godot
          curl -fL --retry 3 -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d /tmp/nightfall-templates
          cp /tmp/nightfall-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Configure Android export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/nightfall-debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US'
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/nightfall-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Install Python test dependencies
        shell: bash
        run: |
          python3 -m pip install --user Pillow

      - name: Run static checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/static_check.py
          python3 tests/map_reachability.py

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --editor --import --quit 2>&1 | tee import.log
          if grep -E '^SCRIPT ERROR:|^ERROR:' import.log; then
            exit 1
          fi

      - name: Test actual game runtime
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://tests/smoke_test.gd 2>&1 | tee smoke.log
          grep -q 'SMOKE PASS' smoke.log

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          ./godot --headless --path . --export-debug Android build/Nightfall-M1-debug.apk 2>&1 | tee export.log
          test -s build/Nightfall-M1-debug.apk
          unzip -t build/Nightfall-M1-debug.apk | tail -1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Android-APK
          path: build/Nightfall-M1-debug.apk
          if-no-files-found: error

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Build-Logs
          path: |
            import.log
            smoke.log
            export.log
          if-no-files-found: ignore
